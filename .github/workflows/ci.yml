name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: IQC_NO_SIMD=1 ./tests/roundtrip
      - name: sanitizers
        run: make clean && make test CFLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all"
